name: CI - PIA-3

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pia3
          POSTGRES_USER: pia3
          POSTGRES_PASSWORD: pia3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pia3 -d pia3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff lint
        run: ruff check src tests scripts migrations

      - name: Run ruff format check
        run: ruff format --check src tests scripts migrations

      - name: Run compile check
        run: python -m compileall src scripts migrations

      - name: Run unit tests (without database)
        run: pytest --ignore=tests/test_db_*.py --ignore=tests/test_checkpoint_reanudacion.py --ignore=tests/test_correlation_id.py -q

      - name: Run integration tests (with PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pia3:pia3@localhost:55432/pia3
        run: pytest tests/test_db_*.py tests/test_checkpoint_reanudacion.py tests/test_correlation_id.py -q

      - name: Run evaluation suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://pia3:pia3@localhost:55432/pia3
        run: python scripts/evaluar_todo.py --salida reporte_evaluacion.json

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: reporte-evaluacion
          path: reporte_evaluacion.json
