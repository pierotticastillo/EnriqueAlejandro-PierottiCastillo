[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pia3"
version = "0.1.0"
description = "Sistema agéntico para la planta de inyección de agua PIA-3 (TP Academia Novit 2026)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "planta-contrato @ git+https://github.com/NovitSoftware/academia2026-tp.git@ab65b95e911731351dba395817a74a8cc60da2b2#subdirectory=contrato",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
  "paho-mqtt>=2.1,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6",
]
asr = [
  "faster-whisper>=1.0,<2",
  # faster-whisper 1.2.x usa av.open(metadata_errors=...), removido en av 16.
  # Se fija una versión compatible para no parchear site-packages.
  "av>=11,<16",
]
rag = [
  # Modelo local de embeddings (ONNX, CPU). La primera build descarga el
  # modelo; después el contenedor trabaja sin salir a internet.
  "fastembed>=0.7,<1",
]

[project.scripts]
pia3-latido = "planta.heartbeat:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# El recorte de los manuales es textual: las tablas del manual tienen líneas
# largas y partirlas rompería el texto que se parsea.
"tests/manuales.py" = ["E501"]
